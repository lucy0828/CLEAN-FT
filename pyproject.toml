[project]
name = "clean-ft"
version = "0.1.0"
description = "CLEAN-FT: Concept-Localized Evidence-Aligned Fine-Tuning. Does LLM loneliness detection align with expert evidence?"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.0",
    "transformers>=4.40",
    "accelerate>=0.30",
    "pandas>=2.0",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "scipy>=1.11",
    "safetensors>=0.4",
    "sentence-transformers>=2.2",
    "spacy>=3.7",
    "pyarrow>=15.0",
    "pyyaml>=6.0",
    "ftfy>=6.3.1",
    "bitsandbytes>=0.50.1",
    "transformer-lens>=3.7.3",
    "sae-lens>=6.49.1",
    "anthropic>=1.0.0",
    "matplotlib>=3.11.1",
    "python-docx>=1.2.0",
    "peft>=0.20",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
